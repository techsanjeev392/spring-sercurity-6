# ===============================
# Server Configuration
# ===============================
# Change the server port if needed (default is 8080)
server.port=8080

# ===============================
# H2 Database Configuration
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# HIBERNATE SETTINGS
# ===============================
# Dialect for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Hibernate DDL Auto: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
#spring.jpa.show-sql=true

# Format SQL Output (Optional)
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONNECTION POOL CONFIG (Optional, Recommended)
# ===============================
# HikariCP settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=H2Pool
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# H2 Specific Settings
# ===============================
# Keep the content when application restarts (for in-memory DB)
spring.datasource.hikari.auto-commit=true
spring.jpa.defer-datasource-initialization=true